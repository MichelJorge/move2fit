<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveChamps 2026 - Oficial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050505;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Fundo com efeito de profundidade */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1b2735 0%, #050505 100%);
            z-index: -1;
        }

        .header-container {
            text-align: center;
            margin-bottom: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeInDown 1.5s ease-out;
        }

        /* EFEITO NO LOGO */
        .wolf-logo {
            width: 380px;
            max-width: 85%;
            height: auto;
            /* Brilho Neon Azul */
            filter: drop-shadow(0 0 25px rgba(0, 210, 255, 0.8));
            animation: float 4s ease-in-out infinite;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #ffffff 40%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        .date-text {
            font-size: 1.3rem;
            letter-spacing: 12px;
            color: #00d2ff;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        /* CARTÕES DO CONTADOR */
        #countdown { display: flex; gap: 20px; z-index: 2; }

        .container {
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 210, 255, 0.4);
            min-width: 130px;
            text-align: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .container:hover {
            transform: translateY(-15px) scale(1.05);
            border-color: #ffffff;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
        }

        .number {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.8);
        }

        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #00d2ff;
            margin-top: 5px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; letter-spacing: 4px; }
            .wolf-logo { width: 280px; }
            #countdown { flex-wrap: wrap; justify-content: center; }
            .container { min-width: 110px; padding: 15px; }
            .number { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    
    <div class="header-container">
        <img src="move.jpeg" alt="MoveChamps Logo" class="wolf-logo">
        <h1>MoveChamps</h1>
        <div class="date-text">23 MAIO 2026</div>
    </div>

    <div id="countdown">
        <div class="container"><div id="days" class="number">00</div><div class="label">Dias</div></div>
        <div class="container"><div id="hours" class="number">00</div><div class="label">Horas</div></div>
        <div class="container"><div id="minutes" class="number">00</div><div class="label">Min</div></div>
        <div class="container"><div id="seconds" class="number">00</div><div class="label">Seg</div></div>
    </div>

    <script>
        function updateCountdown() {
            const targetDate = new Date("May 23, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('countdown').innerHTML = "<h1>O MOMENTO CHEGOU!</h1>";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
