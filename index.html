<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveChamps 2026 - Oficial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050505;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Fundo Animado */
        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            animation: pulseGlow 8s infinite alternate;
        }

        .header-container {
            text-align: center;
            margin-bottom: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeInDown 1.5s ease-out;
        }

        /* AJUSTE DO LOGO - AGORA COM O NOME CORRETO move2.jpeg */
        .wolf-logo {
            width: 350px;
            max-width: 85%;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.6));
            animation: float 4s ease-in-out infinite;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #ffffff 40%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        .date-text {
            font-size: 1.2rem;
            letter-spacing: 12px;
            color: #00d2ff;
            font-weight: bold;
            opacity: 0.8;
        }

        /* CONTADOR */
        #countdown { display: flex; gap: 20px; z-index: 2; }

        .container {
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            min-width: 130px;
            text-align: center;
            transition: 0.4s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .container:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: #00d2ff;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
        }

        .number {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #00d2ff;
            margin-top: 5px;
        }

        /* ANIMAÇÕES */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes pulseGlow {
            from { transform: scale(1); opacity: 0.3; }
            to { transform: scale(1.2); opacity: 0.6; }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; letter-spacing: 4px; }
            .wolf-logo { width: 250px; }
            #countdown { flex-wrap: wrap; justify-content: center; gap: 10px; }
            .container { min-width: 100px; padding: 15px; }
            .number { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    
    <div class="header-container">
        <img src="move2.jpeg" alt="MoveChamps Logo" class="wolf-logo">
        <h1>MoveChamps</h1>
        <div class="date-text">23 MAIO 2026</div>
    </div>

    <div id="countdown">
        <div class="container"><div id="days" class="number">00</div><div class="label">Dias</div></div>
        <div class="container"><div id="hours" class="number">00</div><div class="label">Horas</div></div>
        <div class="container"><div id="minutes" class="number">00</div><div class="label">Min</div></div>
        <div class="container"><div id="seconds" class="number">00</div><div class="label">Seg</div></div>
    </div>

    <script>
        function updateCountdown() {
            const targetDate = new Date("May 23, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('countdown').innerHTML = "<h1>COMEÇOU!</h1>";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
