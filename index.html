<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveChamps 2026 - Official Countdown</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505; /* Fundo ainda mais profundo */
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            perspective: 1000px;
        }

        /* Efeito de Partículas ao fundo */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1b2735 0%, #050505 100%);
            z-index: -2;
        }

        /* Logo do Lobo com animação Floating e Neon Pulse */
        .wolf-logo {
            width: 380px;
            max-width: 85%;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.5));
            animation: float 4s ease-in-out infinite, neonPulse 3s infinite alternate;
            z-index: 1;
        }

        .header-container {
            text-align: center;
            margin-bottom: 3.5rem;
            animation: fadeInDown 1.5s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #ffffff 30%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 12px;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.3));
            margin-top: 15px;
        }

        .date-text {
            font-size: 1.4rem;
            letter-spacing: 15px;
            color: #00d2ff;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
        }

        /* Grid do Contador */
        #countdown {
            display: flex;
            gap: 30px;
            z-index: 2;
        }

        /* Cartão Moderno com Reflexo */
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 35px 25px;
            border-radius: 15px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 150px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            transition: 0.5s;
        }

        /* Linha brilhante no topo do cartão */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(0, 210, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .container:hover {
            transform: translateY(-15px) scale(1.05);
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.05);
        }

        .container:hover::before {
            transform: translateX(100%);
        }

        .number {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3), 0 0 30px rgba(0, 210, 255, 0.6);
        }

        .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-top: 15px;
            color: #00d2ff;
            font-weight: 700;
        }

        /* Glow dinâmico de fundo */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.2), transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulseGlow 5s infinite alternate;
        }

        /* ANIMAÇÕES */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        @keyframes neonPulse {
            from { filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4)); }
            to { filter: drop-shadow(0 0 35px rgba(0, 210, 255, 0.9)); }
        }

        @keyframes pulseGlow {
            from { opacity: 0.3; scale: 1; }
            to { opacity: 0.6; scale: 1.2; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-100px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilo mobile */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; letter-spacing: 5px; }
            .wolf-logo { width: 250px; }
            #countdown { flex-wrap: wrap; justify-content: center; gap: 15px; }
            .container { min-width: 120px; padding: 20px; }
            .number { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="particles"></div>
    <div class="bg-glow"></div>
    
    <div class="header-container">
        <img src="move.jpeg" alt="Logo Move" class="wolf-logo">
        <h1>MoveChamps</h1>
        <div class="date-text">23 de Maio 2026</div>
    </div>

    <div id="countdown">
        <div class="container">
            <div id="days" class="number">00</div>
            <div class="label">Dias</div>
        </div>
        <div class="container">
            <div id="hours" class="number">00</div>
            <div class="label">Horas</div>
        </div>
        <div class="container">
            <div id="minutes" class="number">00</div>
            <div class="label">Minutos</div>
        </div>
        <div class="container">
            <div id="seconds" class="number">00</div>
            <div class="label">Segundos</div>
        </div>
    </div>

    <script>
        function updateCountdown() {
            const targetDate = new Date("May 23, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('countdown').innerHTML = "<h1>O MOMENTO CHEGOU!</h1>";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
