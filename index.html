<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveChamps 2026 - Official Countdown</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050505;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Fundo Dinâmico */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1b2735 0%, #050505 100%);
            z-index: -2;
        }

        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.15), transparent 70%);
            border-radius: 50%;
            z-index: -1;
            animation: pulseGlow 5s infinite alternate;
        }

        /* LOGO - Onde estava o erro */
        .header-container {
            text-align: center;
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: fadeInDown 1.2s ease-out;
        }

        .wolf-logo {
            width: 320px; /* Tamanho ajustado */
            max-width: 80%;
            height: auto;
            /* Efeito de Neon no Logo */
            filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.7));
            animation: float 4s ease-in-out infinite;
            display: block;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #ffffff 40%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 10px;
            text-transform: uppercase;
        }

        .date-text {
            font-size: 1.2rem;
            letter-spacing: 12px;
            color: #00d2ff;
            font-weight: bold;
            margin-top: -5px;
        }

        /* CONTADOR */
        #countdown { display: flex; gap: 20px; z-index: 2; }

        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            min-width: 130px;
            text-align: center;
            transition: 0.4s;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .container:hover {
            transform: translateY(-10px);
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.05);
        }

        .number {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #00d2ff;
        }

        /* ANIMAÇÕES */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes pulseGlow {
            from { opacity: 0.2; transform: scale(1); }
            to { opacity: 0.5; transform: scale(1.3); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            #countdown { flex-wrap: wrap; justify-content: center; }
            h1 { font-size: 2rem; letter-spacing: 4px; }
            .wolf-logo { width: 220px; }
            .container { min-width: 100px; padding: 15px; }
            .number { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="particles"></div>
    <div class="bg-glow"></div>
    
    <div class="header-container">
        <img src="move.jpeg" alt="MoveChamps Logo" class="wolf-logo">
        <h1>MoveChamps</h1>
        <div class="date-text">23 MAIO 2026</div>
    </div>

    <div id="countdown">
        <div class="container"><div id="days" class="number">00</div><div class="label">Dias</div></div>
        <div class="container"><div id="hours" class="number">00</div><div class="label">Horas</div></div>
        <div class="container"><div id="minutes" class="number">00</div><div class="label">Min</div></div>
        <div class="container"><div id="seconds" class="number">00</div><div class="label">Seg</div></div>
    </div>

    <script>
        function updateCountdown() {
            const targetDate = new Date("May 23, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('countdown').innerHTML = "<h1>O EVENTO COMEÇOU!</h1>";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
